<script> const storePhone = "2347083347251"; const products = [ {id:1,name:"Classic T-shirt",price:8500,icon:"👕"}, {id:2,name:"Fashion Sneakers",price:25000,icon:"👟"}, {id:3,name:"Casual Hoodie",price:18000,icon:"🧥"}, {id:4,name:"Stylish Handbag",price:14000,icon:"👜"}, {id:5,name:"Baseball Cap",price:5000,icon:"🧢"}, {id:6,name:"Classic Wristwatch",price:12000,icon:"⌚"} ]; let cart = []; function money(n){ return "₦" + n.toLocaleString("en-NG"); } function render(){ const query = document.getElementById("search").value.toLowerCase(); document.getElementById("products").innerHTML = products.filter(p=>p.name.toLowerCase().includes(query)) .map(p=>`
${p.icon}
${p.name}
${money(p.price)}

Add to cart `).join(""); document.getElementById("cart").innerHTML = cart.length ? cart.map(i=>{ const p=products.find(x=>x.id===i.id); return `
${p.name} × ${i.qty} ${money(p.price*i.qty)} −
`; }).join("") : "Your cart is empty."; const total=cart.reduce((sum,i)=> sum+products.find(p=>p.id===i.id).price*i.qty,0); document.getElementById("total").textContent="Total: "+money(total); } function add(id){ const item=cart.find(i=>i.id===id); if(item)item.qty++; else cart.push({id,qty:1}); render(); } function removeItem(id){ const item=cart.find(i=>i.id===id); if(item.qty>1)item.qty--; else cart=cart.filter(i=>i.id!==id); render(); } document.getElementById("checkout").addEventListener("submit",function(e){ e.preventDefault(); if(!cart.length){ document.getElementById("message").textContent= "Add a product before placing your order."; return; } const name=document.getElementById("name").value.trim(); const phone=document.getElementById("phone").value.trim(); const address=document.getElementById("address").value.trim(); const payment=document.getElementById("payment").value; const lines=cart.map(i=>{ const p=products.find(x=>x.id===i.id); return `${p.name} x ${i.qty} = ${money(p.price*i.qty)}`; }); const total=cart.reduce((sum,i)=> sum+products.find(p=>p.id===i.id).price*i.qty,0); const message = `NEW ORDER - MR DAVE STORE\n\n`+ `Customer: ${name}\n`+ `Phone: ${phone}\n`+ `Delivery address: ${address}\n\n`+ `Products:\n${lines.join("\n")}\n\n`+ `Total: ${money(total)}\n`+ `Payment: ${payment}\n\n`+ `Please confirm stock, delivery cost and order details.`; const url="https://wa.me/"+storePhone+ "?text="+encodeURIComponent(message); window.open(url,"_blank"); }); render(); </script>
